name: Dealership App CI

on:
  push:
    branches: [main]
    paths:
      - "verticals/dealership-agentflow-pro/app/**"
      - ".github/workflows/dealership-app-ci.yml"
  pull_request:
    paths:
      - "verticals/dealership-agentflow-pro/app/**"
      - ".github/workflows/dealership-app-ci.yml"

defaults:
  run:
    working-directory: verticals/dealership-agentflow-pro/app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: verticals/dealership-agentflow-pro/app/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build
